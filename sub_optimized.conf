微软服务 = select, DIRECT, "节点选择", "美国节点", "香港节点", "台湾节点", "新加坡节点", "日本节点", "未排节点", icon-url=https://raw.githubusercontent.com/Hawaiine/Oasisic-Icons/main/icons/Microsoft/Microsoft/Microsoft.png
