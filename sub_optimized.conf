# 地区自动测速组
香港节点 = smart, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=香港, include-other-group="any协议, ss协议", icon-url=https://raw.githubusercontent.com/Hawaiine/Oasisic-Icons/main/icons/Country/HongKong/HongKong.png
