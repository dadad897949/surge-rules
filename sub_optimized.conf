any协议 = select, update-interval=-1, no-alert=0, hidden=0, include-all-proxies=0, policy-path=https://sub.store/download/Any, icon-url=https://raw.githubusercontent.com/Hawaiine/Oasisic-Icons/main/icons/System/Auto/Auto.png
