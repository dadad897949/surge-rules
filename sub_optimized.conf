[Rule]
# dl.google.com 覆盖走代理（UnBan 里是直连，直连会 hang）
DOMAIN,dl.google.com,"谷歌"
RULE-SET,https://cdn.jsdelivr.net/gh/dadad897949/surge-rules@main/rule/UnBan.list,"全球直连","update-interval=86400"
RULE-SET,LAN,DIRECT,no-resolve
IP-CIDR,198.19.255.255/32,REJECT,no-resolve
# AI（11 家：OpenAI/Claude/Gemini/Copilot 等，不再掉进漏网之鱼）
# 规则集已自建：dadad897949/surge-rules（基于 blankmagic，去掉了 Apple Intelligence 分区）
# apple-direct.list 是 9 个苹果服务域名的直连兜底（App Store CDN、iCloud 专用代理、
# Siri 后端、地图/定位/Spotlight），防 AI 规则集将来误收录，必须排在 AI 规则之前
RULE-SET,https://cdn.jsdelivr.net/gh/dadad897949/surge-rules@main/rule/apple-direct.list,"苹果服务","update-interval=86400"
RULE-SET,https://cdn.jsdelivr.net/gh/dadad897949/surge-rules@main/rule/ai.list,"AI","update-interval=86400"
# 常用服务
RULE-SET,https://cdn.jsdelivr.net/gh/dadad897949/surge-rules@main/rule/PikPak.list,"节点选择","update-interval=86400"
RULE-SET,https://cdn.jsdelivr.net/gh/dadad897949/surge-rules@main/rule/TikTok.list,"国外媒体","update-interval=86400"
RULE-SET,https://cdn.jsdelivr.net/gh/dadad897949/surge-rules@main/rule/YouTube.list,"国外媒体","update-interval=86400"
